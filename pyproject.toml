[project]
name = "tuto"
version = "0.1.0"
description = "Citation audit pipeline: extract references from published papers and verify they exist."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "tqdm>=4.66",
    "defusedxml>=0.7",
    "pdfplumber>=0.11",
    "lxml>=5.0",
    "pylatexenc>=2.10",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.scripts]
tuto = "tuto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuto"]

[tool.uv]
# Security floor for transitive deps.
# pdfplumber allows Pillow>=12.2.0, which still resolves the vulnerable 12.3.0 line.
# fastapi requires opentelemetry-api>=1.44.0, which still allows 1.45.1 (GHSA-mf5v-w3w3-f6cg).
# httpx/httpcore allow certifi without a floor. 2026.10.18 is the advisory minimum, but
# 2026.10.19 restored emSign C1/C3; 2026.10.23 drops them again and is the version
# already locked on https://github.com/tao-hpu/tuto/pull/3. This branch keeps that floor
# and resolves the current 2026.11.20 bundle. PR 3 is left open.
constraint-dependencies = [
    "pillow>=13.0.0",
    "cryptography>=50.0.0",
    "opentelemetry-api>=1.45.2",
    "certifi>=2026.10.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
