allowBuilds:
  sharp: true
# pnpm 11 reads overrides from here, not from package.json.
# Parent ranges still accept the vulnerable releases, so pin the patched ones.
overrides:
  "nanoid@>=3.3.0 <3.3.20": "3.3.20"
  "source-map-js@<1.2.2": "1.2.2"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": "2.11.30"
